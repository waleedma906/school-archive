<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأرشيف الرقمي الشامل للمدرسة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b66'/%3E%3Cpath d='M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* تخطيط: شريط علوي ثابت + تبويبات، ومحتوى بعرض أقصى 1100px؛ المؤشرات والسجلات والأنشطة قوائم قابلة للفتح، والملفات بطاقات. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --surface-2: #e9f1ef; --ink: #10302e; --muted: #587270; --line: #d4e1de;
  --brand: #0b6b66; --brand-ink: #ffffff; --brand-soft: #d8eeea;
  --ok: #1d724a; --ok-soft: #dcf2e5; --warn: #8f5400; --warn-soft: #fbeccf; --bad: #b3261e; --bad-soft: #fbe0dd; --gray-soft: #e4ebe9;
  --shadow: 0 1px 2px rgba(16,48,46,.06), 0 6px 18px rgba(16,48,46,.06);
  --f-display: 'Noto Kufi Arabic', 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1817; --surface: #132422; --surface-2: #1a2f2c; --ink: #e3f0ee; --muted: #93afab; --line: #26403c;
    --brand: #3fb8ad; --brand-ink: #04211f; --brand-soft: #173a37;
    --ok: #5cd08f; --ok-soft: #14352a; --warn: #f0b865; --warn-soft: #3a2c10; --bad: #ff8f86; --bad-soft: #40201d; --gray-soft: #1f3431;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1817; --surface: #132422; --surface-2: #1a2f2c; --ink: #e3f0ee; --muted: #93afab; --line: #26403c;
  --brand: #3fb8ad; --brand-ink: #04211f; --brand-soft: #173a37;
  --ok: #5cd08f; --ok-soft: #14352a; --warn: #f0b865; --warn-soft: #3a2c10; --bad: #ff8f86; --bad-soft: #40201d; --gray-soft: #1f3431;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  padding-block: 0 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1100px; margin-inline: auto; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* الشريط العلوي */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.idblock { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 320px; }
.mark { width: 42px; height: 42px; border-radius: 11px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.mark svg { width: 24px; height: 24px; }
h1 { font-family: var(--f-display); font-size: 1.2rem; line-height: 1.35; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { font-size: .85rem; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 0 1 auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: .88rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 40px; height: 40px; padding: 0; justify-content: center; }
select, input[type=text], input[type=url], input[type=search], textarea {
  width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
}
select { appearance: auto; }
textarea { min-height: 84px; resize: vertical; }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: .8rem; font-weight: 600; background: var(--gray-soft); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }

.banner { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: .9rem; display: flex; gap: 10px; align-items: center; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 12px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { flex: none; border: 0; background: none; padding: 10px 16px; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
.tab .n { margin-inline-start: 6px; }

main { padding-top: 22px; }
h2 { font-family: var(--f-display); font-size: 1.1rem; margin: 0 0 12px; font-weight: 700; }
h3 { font-family: var(--f-display); font-size: .98rem; margin: 0; font-weight: 600; }
.sec { margin-top: 30px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

/* لوحة المتابعة */
.meter { display: grid; gap: 8px; }
.meter .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.meter .big { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.track { height: 10px; border-radius: 99px; background: var(--gray-soft); overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }
.seg-ok { background: var(--ok); } .seg-warn { background: #d9962b; } .seg-none { background: var(--line); }
.dom { display: grid; grid-template-columns: minmax(130px, 200px) 1fr auto; gap: 12px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); }
.dom:first-of-type { border-top: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin-top: 10px; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; min-height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: .85rem; text-decoration: none; color: var(--ink); }
button.chip:hover, a.chip:hover { border-color: var(--brand); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip .x { border: 0; background: none; padding: 0 2px; color: var(--muted); line-height: 1; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 6px; }

/* القوائم */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar > * { flex: 1 1 180px; min-width: 0; }
.toolbar .grow { flex: 3 1 260px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.group-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 26px 0 10px; }
.group-title h2 { margin: 0; }
.std { margin-bottom: 14px; }
.std-head { padding: 12px 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r) var(--r) 0 0; }
.std-note { font-size: .82rem; color: var(--muted); }
.item { border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; }
.item-head { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: start; padding: 12px 16px; border: 0; background: none; }
.item-head:hover { background: color-mix(in srgb, var(--brand) 5%, transparent); }
.item-head.two { grid-template-columns: 1fr auto; }
.code { font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; min-width: 4.2em; }
.item-text { min-width: 0; overflow-wrap: anywhere; }
.item-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.item-body { padding: 4px 16px 16px 16px; display: grid; gap: 14px; }
.item-body .lab { font-size: .82rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.mini-files { display: grid; gap: 6px; }
.mini-files a { display: flex; gap: 8px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.chev { transition: transform .15s; }
.item-head[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* بطاقات الملفات */
.files { display: grid; gap: 12px; }
.file { padding: 14px 16px; display: grid; gap: 10px; }
.file.gone { opacity: .75; }
.file-top { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.file-title { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; min-width: 0; flex: 1 1 260px; }
.file-title a { text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.file-title a:hover { text-decoration: underline; }
.file-host { font-size: .8rem; color: var(--muted); display: block; }
.file-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.file-meta { font-size: .82rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.note { font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }

/* نافذة الإضافة */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(5, 20, 19, .55); display: grid; place-items: end center; padding: 0; overflow-y: auto; }
.sheet { width: min(680px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); border: 1px solid var(--line); }
@media (min-width: 720px) { .overlay { place-items: center; padding: 24px; } .sheet { border-radius: 18px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, .field .lab { font-weight: 600; font-size: .92rem; }
.hint { font-size: .82rem; color: var(--muted); }
.err { font-size: .84rem; color: var(--bad); min-height: 1.2em; }
.preview { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface-2); }
.preview li { margin-inline-start: 0; }
.preview ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.sheet-foot { display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; margin-top: 18px; }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: .88rem; }

/* الإدارة */
.adm-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.adm-row:first-child { border-top: 0; }
.adm-row.off input[type=text] { text-decoration: line-through; color: var(--muted); }
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.step .num { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: .9rem; }

#toasts { position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; max-width: min(520px, 100%); font-size: .92rem; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
@media (max-width: 640px) {
  .dom { grid-template-columns: 1fr; gap: 6px; }
  .item-head { grid-template-columns: 1fr; gap: 6px; }
  .item-head.two { grid-template-columns: 1fr auto; }
  .item-meta { justify-content: flex-start; }
  h1 { font-size: 1.05rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* بوابة الدخول (النسخة المستقلة) */
#gate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: var(--bg); }
#gate[hidden] { display: none; }
.gate-card { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 14px; text-align: right; }
.gate-card h2 { margin: 0; font-family: var(--f-display); font-size: 1.25rem; }
.gate-card p { margin: 0; line-height: 1.8; }
.gate-card .err { color: var(--bad); min-height: 1.4em; }

</style>
<script src="config.js"></script>
</head>
<body>
<div dir="rtl" lang="ar">
  <div class="top"><div class="wrap"><div id="top"></div><div id="tabs" class="tabs" role="tablist" aria-label="أقسام الأرشيف"></div></div></div>
  <main class="wrap"><div id="view" role="tabpanel"></div></main>
  <div id="modal" dir="rtl"></div>
  <div id="toasts" aria-live="polite"></div>
</div>
<script>
/* بيانات المرجع — مصدرها: مرجع «المؤشرات والأنشطة والأهداف» (ثانوية الإمام محمد بن سعود، 1448هـ)
   وصورة «تصنيف سجلات العمل على مجالات التقويم الذاتي». لا تُعدَّل إلا بمطابقة المصدر. */

const DOMAINS = [
  { id: '1', name: 'الإدارة المدرسية' },
  { id: '2', name: 'التعليم والتعلم' },
  { id: '3', name: 'نواتج التعلم' },
  { id: '4', name: 'البيئة المدرسية' },
];

const STANDARDS = [
  { id: '1-1', domain: '1', name: 'التخطيط' },
  { id: '1-2', domain: '1', name: 'قيادة العملية التعليمية' },
  { id: '1-3', domain: '1', name: 'المجتمع المدرسي' },
  { id: '1-4', domain: '1', name: 'التطوير المؤسسي' },
  { id: '1-5', domain: '1', name: 'حقوق المتعلم وحمايته' },
  { id: '2-1', domain: '2', name: 'بناء خبرات التعلم' },
  { id: '2-2', domain: '2', name: 'تقويم التعلم' },
  { id: '3-1', domain: '3', name: 'التحصيل التعليمي' },
  { id: '3-2', domain: '3', name: 'التطور الشخصي والصحي والاجتماعي' },
  { id: '4-1', domain: '4', name: 'المبنى المدرسي' },
  { id: '4-2', domain: '4', name: 'الأمن والسلامة' },
];

/* 45 مؤشراً — [الرمز، النص]. المعيار يُشتق من أول رقمين من الرمز. */
const INDICATOR_ROWS = [
  ['1-1-1-1', 'تضع المدرسة خطة تشغيلية شاملة وفق أهداف تطويرية محددة.'],
  ['1-1-1-2', 'تتابع المدرسة تنفيذ خطتها التشغيلية، وتطورها بما يضمن تحقيق أهدافها.'],
  ['1-2-1-1', 'تعزز المدرسة القيم الإسلامية، والهوية الوطنية.'],
  ['1-2-1-2', 'تطبق المدرسة قيم مهنة التعليم وأخلاقياتها، وتتابع الالتزام بها.'],
  ['1-2-1-3', 'تطبق المدرسة إجراءات محددة؛ لدعم الانضباط المدرسي، وتتابع الالتزام بها.'],
  ['1-2-1-4', 'تنفذ المدرسة برامج وأنشطة تربوية داعمة للسلوك الإيجابي لدى المتعلمين، ومنهم ذوو الإعاقة والموهوبون، وتتابعها.'],
  ['1-2-1-5', 'تنفذ المدرسة برامج وأنشطة إثرائية؛ لتطوير مواهب المتعلمين، وتهيئهم للمستقبل، وتتابعها.'],
  ['1-3-1-1', 'تعزز المدرسة بناء العلاقات الإيجابية والتعاون في المجتمع المدرسي.'],
  ['1-3-1-2', 'تعزز المدرسة مشاركة الأسرة في تعلم أبنائهم، والتحضير لمستقبلهم.'],
  ['1-3-1-3', 'تعزز المدرسة الشراكة المجتمعية؛ لدعم التعلم والتأثير الإيجابي في المجتمع.'],
  ['1-4-1-1', 'تدعم المدرسة منسوبيها للحصول على الرخصة المهنية، وتتابعها.'],
  ['1-4-1-2', 'تدعم المدرسة التطوير المهني لمنسوبيها وفقًا لنتائج التقويم وتحليل احتياجاتهم.'],
  ['1-4-1-3', 'تطبق المدرسة التقويم الذاتي المبني على المعايير المعتمدة من الهيئة بشكل مستمر.'],
  ['1-4-1-4', 'تنفذ المدرسة خطة التحسين بناء على نتائج التقويم المدرسي، وتتابعها.'],
  ['1-5-1-1', 'تلتزم المدرسة بالمحافظة على حقوق المتعلمين، وحمايتهم.'],
  ['1-5-1-2', 'توفر المدرسة مناخًا آمنًا للتعلم والنمو نفسيًا واجتماعيًا.'],
  ['2-1-1-1', 'توفر المدرسة فرصًا متكافئة للتعلم تلبي احتياجات المتعلمين، ومنهم ذوو الإعاقة والموهوبون.'],
  ['2-1-1-2', 'تدعم المدرسة تنفيذ المناهج بما يحقق نواتج التعلم المستهدفة.'],
  ['2-1-1-3', 'تنوع المدرسة في إستراتيجيات التعليم والتعلم؛ لتلبية احتياجات المتعلمين، ودعم تعلمهم.'],
  ['2-1-1-4', 'تفعل المدرسة التقنية الرقمية؛ لدعم تعلم المتعلمين وتلبية احتياجاتهم.'],
  ['2-1-1-5', 'تنفذ المدرسة أنشطة تعلم تطبيقية ترتبط بحياة المتعلمين.'],
  ['2-1-1-6', 'تنمي المدرسة المهارات القرائية والعددية الأساسية لدى المتعلمين.'],
  ['2-1-1-7', 'تنمي المدرسة مهارات التفكير والبحث والابتكار لدى المتعلمين.'],

/* منطق الأرشيف — دوال نقية بلا اعتماد على الواجهة ولا قاعدة البيانات (تُختبر بـ node). */
const ArchiveLogic = (() => {
  const pad2 = n => String(n).padStart(2, '0');

  function buildModel(data, custom) {
    custom = custom || {};
    const stdName = Object.fromEntries(data.STANDARDS.map(s => [s.id, s.name]));
    const indicators = data.INDICATOR_ROWS.map(([code, text]) => {
      const parts = code.split('-');
      const std = parts.slice(0, 2).join('-');
      return { code, text, domain: parts[0], standard: std, standardName: stdName[std] || '', activities: [] };
    });
    const indicatorByCode = Object.fromEntries(indicators.map(i => [i.code, i]));

    const activities = data.ACTIVITY_ROWS.map(([id, title, inds]) => ({ id, title, indicators: [...inds], custom: false }));
    for (const a of custom.extraActivities || []) {
      activities.push({ id: a.id, title: a.title, indicators: [...(a.indicators || [])], custom: true });
    }
    for (const a of activities) {
      for (const c of a.indicators) if (indicatorByCode[c]) indicatorByCode[c].activities.push(a.id);
    }
    const activityById = Object.fromEntries(activities.map(a => [a.id, a]));

    const groupById = Object.fromEntries(data.REGISTER_GROUPS.map(g => [g.id, g]));
    const registers = [];
    for (const g of data.REGISTER_GROUPS) {
      g.registers.forEach((name, i) => {
        const id = `${g.id}-${pad2(i + 1)}`;
        const ov = (custom.registers || {})[id] || {};
        registers.push({ id, name: ov.name || name, groupId: g.id, groupName: g.name, domainId: g.domain, hidden: !!ov.hidden, custom: false });
      });
    }
    for (const r of custom.extraRegisters || []) {
      const g = groupById[r.groupId];
      const ov = (custom.registers || {})[r.id] || {};

    if (c === 'quota_exceeded') return 'امتلأت سعة التخزين. احذف ما لا يلزم أو صدّر النسخة وابدأ عاماً جديداً.';

    if (c === 'revoked') return 'سُحبت صلاحيتك أثناء العمل. أعد فتح الصفحة.';
    return 'تعذّر الحفظ. تحقق من الاتصال ثم أعد المحاولة.';
  }

  /* ---------- اتصال ---------- */
  async function connect() {
    let dbNs = null, userNs = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        [dbNs, userNs] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      }
    } catch (e) { /* يستمر في وضع المعاينة */ }
    if (dbNs) { S.db = dbNs; S.mode = 'live'; } else { S.db = makeMemoryDb(); S.mode = 'demo'; }
    S.user = userNs;
    if (S.mode === 'demo') { S.perm = { uid: 'demo', name: 'معاينة', admin: true, write: true }; seedDemo(); }
    else if (userNs) {
      try {
        const me = await userNs.me();
        S.perm.uid = me.id; S.perm.name = me.name || '';
        S.perm.admin = !!(me.canEdit || me.isOwner);
        const cw = await userNs.can('data.write');
        S.perm.write = S.perm.admin || cw === true || (cw === null && !!me.id);
      } catch (e) { /* عرض فقط */ }
    }
    const onErr = e => { S.error = e && e.code === 'revoked' ? 'سُحبت صلاحية الوصول. أعد فتح الصفحة.' : 'تعذّر تحميل البيانات.'; S.loaded.files = true; render(); };
    S.db.collection('evidence').onSnapshot(snap => {
      S.files = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded.files = true; onData(); loadProfiles();
    }, onErr);
    S.db.doc('meta/custom').onSnapshot(s => { S.custom = s.exists ? { ...s.data() } : {}; onData(); }, () => {});
    S.db.doc('meta/state').onSnapshot(s => {
      const d = s.exists ? s.data() : {};
      S.meta = { year: d.year || DEFAULT_YEAR, closed: Array.isArray(d.closed) ? [...d.closed] : [] };
      onData();
    }, () => {});
    S.db.doc('meta/backup').onSnapshot(s => { S.backup = s.exists ? { ...s.data() } : null; onData(); }, () => {});
  }
  async function loadProfiles() {
    if (!S.user) return;
    const ids = [...new Set(S.files.map(f => f.createdBy).filter(Boolean))].sort();
    const key = ids.join('|');
    if (!ids.length || key === profKey) return;
    profKey = key;
    try {
      const ps = await S.user.profiles(ids);
      const next = {};
      for (const id of ids) next[id] = (ps[id] && ps[id].name) || '';
      S.names = next; onData();
    } catch (e) { /* الأسماء اختيارية */ }
  }
  function seedDemo() {
    const d = S.db, now = new Date().toISOString();
    const rows = [
      { title: 'صور البرنامج الإذاعي — اليوم الوطني (مثال)', url: 'https://drive.google.com/drive/folders/demo-1', activityIds: ['ن01'], registerIds: ['RS2-01'], note: 'ملف تجريبي يظهر في المعاينة فقط.' },
      { title: 'كشف متابعة الصيانة الشهري (مثال)', url: 'https://drive.google.com/drive/folders/demo-2', activityIds: [], registerIds: ['RS8-02'], note: '' },
      { title: 'ملف لم يُصنّف بعد (مثال)', url: 'https://drive.google.com/drive/folders/demo-3', activityIds: [], registerIds: [], note: '' },
    ];
    rows.forEach((r, i) => d.collection('evidence').add({ ...r, year: DEFAULT_YEAR, createdBy: 'demo', createdAt: now, deleted: false, i }));
  }
  function onData() {
    recompute();
    if (!S.ready) return;
    render();
  }

  /* ---------- الرأس والتبويبات ---------- */
  function renderTop() {
    const ys = years();
    const yearSel = ys.length > 1
      ? `<label class="sr" for="yearSel">العام</label><select id="yearSel" style="width:auto;min-width:110px">${ys.map(y => `<option value="${esc(y)}"${y === S.viewYear ? ' selected' : ''}>${esc(y)}هـ${y === S.meta.year ? ' (الحالي)' : ''}</option>`).join('')}</select>`
      : '';
    const demo = S.mode === 'demo' ? `<div class="banner" role="note">${ic('alert')}<span>وضع المعاينة: هذه بيانات تجريبية لا تُحفظ. تُحفظ البيانات الحقيقية عند فتح الأرشيف من حسابك.</span></div>` : '';
    const ro = S.mode === 'live' && !S.perm.write ? `<div class="banner" role="note">${ic('alert')}<span>لديك صلاحية عرض فقط. لإضافة ملفات اطلب صلاحية «مساهم» من مالك الأرشيف.</span></div>` : '';
    const plat = window.ARCHIVE_PLATFORM || null;
    const loc = plat && plat.kind === 'local' ? `<div class="banner" role="note">${ic('alert')}<span>وضع التجربة المحلي: ما تضيفه يُحفظ في هذا المتصفح فقط ولا يراه الآخرون. لربط الأرشيف بقاعدة بيانات مشتركة اتبع ملف README.</span></div>` : '';
    const out = plat && typeof plat.signOut === 'function' ? `<button class="btn sm" type="button" data-do="signout">خروج</button>` : '';
    const err = S.error ? `<div class="banner" role="alert">${ic('alert')}<span>${esc(S.error)}</span></div>` : '';
    const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    $('#top').innerHTML = `
      <div class="bar">
        <div class="idblock"><div class="mark">${ic('book')}</div>
          <div><h1>الأرشيف الرقمي الشامل للمدرسة</h1><div class="sub">${esc(SCHOOL)} · العام الدراسي ${esc(S.viewYear || S.meta.year)}هـ</div></div></div>
        <div class="tools">
          ${yearSel}
          <span class="pill brand" title="صلاحيتك">${esc(roleLabel())}</span>${out}
          <button class="btn icon-btn" type="button" data-do="theme" aria-label="${dark ? 'الوضع الفاتح' : 'الوضع الداكن'}">${ic(dark ? 'sun' : 'moon')}</button>
          ${S.perm.write ? `<button class="btn primary" type="button" data-do="add">${ic('plus')}إضافة ملف</button>` : ''}
        </div>
      </div>${demo}${loc}${ro}${err}`;
    const tabs = [['dash', 'لوحة المتابعة'], ['ind', 'المؤشرات'], ['reg', 'السجلات'], ['act', 'الأنشطة'], ['files', 'الملفات']];
    if (S.perm.admin) tabs.push(['adm', 'الإدارة']);
    $('#tabs').innerHTML = tabs.map(([k, t]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${S.tab === k}">${t}${k === 'files' && S.stats ? `<span class="pill n">${nf.format(S.stats.total)}</span>` : ''}</button>`).join('');
  }

  /* ---------- العرض ---------- */
  function render() {
    if (!S.ready) return;
    renderTop();
    if (!S.loaded.files) { $('#view').innerHTML = '<div class="empty muted">جارٍ تحميل الأرشيف…</div>'; S.mounted = null; return; }
    if (S.mounted !== S.tab) mount(); else refresh();
  }
  function mount() {
    S.mounted = S.tab;
    const v = $('#view');
    if (S.tab === 'dash') v.innerHTML = dashHTML();
    else if (S.tab === 'adm') v.innerHTML = admHTML();
    else { v.innerHTML = toolbarHTML() + '<div id="list"></div>'; fillList(); }
  }
  function refresh() {
    if (S.tab === 'dash') $('#view').innerHTML = dashHTML();
    else if (S.tab === 'adm') { const a = document.activeElement; if (!(a && $('#view').contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) $('#view').innerHTML = admHTML(); }
    else { rebuildToolbarOptions(); fillList(); }
  }
  function go(tab) { S.tab = tab; S.mounted = null; render(); window.scrollTo({ top: 0 }); }

  /* ----- لوحة المتابعة ----- */
  function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }
  function dashHTML() {
    const st = S.stats, m = S.model;
    const nInd = m.indicators.length;
    const withAct = m.indicators.filter(i => i.activities.length).length;
    const gapAct = st.indicatorsWithoutEvidence.filter(c => m.indicatorByCode[c].activities.length);
    const regsVis = m.registers.filter(r => !r.hidden);
    const ev = st.indicatorsWithEvidence;
    const wOk = pct(ev, nInd), wWarn = pct(withAct - ev, nInd), wNone = 100 - wOk - wWarn;
    const unc = st.unclassified;
    const empty = st.total === 0;

    const domRows = m.domains.map(d => {
      const inds = m.indicators.filter(i => i.domain === d.id);
      const e = inds.filter(i => st.byIndicator[i.code] > 0).length;
      const a = inds.filter(i => i.activities.length && !st.byIndicator[i.code]).length;
      const n = inds.length - e - a;
      return `<div class="dom"><div><h3>${esc(d.name)}</h3></div>
        <div class="track" role="img" aria-label="${e} موثّق، ${a} له نشاط بلا دليل، ${n} بلا نشاط"><i class="seg-ok" style="width:${pct(e, inds.length)}%"></i><i class="seg-warn" style="width:${pct(a, inds.length)}%"></i><i class="seg-none" style="width:${pct(n, inds.length)}%"></i></div>
        <div class="muted" style="font-variant-numeric:tabular-nums">${e} من ${inds.length}</div></div>`;
    }).join('');

    const chipInd = c => `<button type="button" class="chip" data-do="open-ind" data-v="${esc(c)}"><span class="ltr">${esc(c)}</span></button>`;
    const recent = [...S.view].filter(f => !f.deleted).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''))).slice(0, 5);
    const lastBk = S.backup && S.backup.at ? S.backup.at : null;
    const bkDays = lastBk ? Math.floor((Date.now() - new Date(lastBk).getTime()) / 864e5) : null;

    return `
      ${empty ? `<div class="card empty" style="margin-bottom:18px"><h3>لا توجد ملفات لعام ${esc(S.viewYear)}هـ بعد</h3><p>أضف أول دليل: اختر السجل أو النشاط وسيُربط الملف بمؤشراته تلقائياً.</p>${S.perm.write ? `<button class="btn primary" type="button" data-do="add">${ic('plus')}إضافة أول ملف</button>` : ''}</div>` : ''}
      <div class="grid2">
        <div class="card pad meter"><div class="row"><h3>المؤشرات الموثّقة بدليل</h3><span class="muted">من ${nInd} مؤشراً</span></div>
          <div class="big">${ev}<span class="muted" style="font-size:1rem"> / ${nInd}</span></div>
          <div class="track" role="img" aria-label="${ev} مؤشراً موثقاً"><i class="seg-ok" style="width:${wOk}%"></i><i class="seg-warn" style="width:${wWarn}%"></i><i class="seg-none" style="width:${wNone}%"></i></div>
          <div class="legend"><span><b class="seg-ok"></b>موثّق</span><span><b class="seg-warn"></b>له نشاط ولا دليل</span><span><b class="seg-none"></b>لا نشاط في الخطة (${st.indicatorsNoActivity.length})</span></div></div>
        <div class="card pad meter"><div class="row"><h3>السجلات التي فيها ملفات</h3><span class="muted">من ${regsVis.length} سجلاً</span></div>
          <div class="big">${st.registersWithEvidence}<span class="muted" style="font-size:1rem"> / ${regsVis.length}</span></div>
          <div class="track" role="img" aria-label="${st.registersWithEvidence} سجلاً"><i class="seg-ok" style="width:${pct(st.registersWithEvidence, regsVis.length)}%"></i></div>
          <div class="row"><span class="muted">إجمالي الملفات: <b>${nf.format(st.total)}</b></span>
          ${unc ? `<button type="button" class="chip warn" data-do="show-unc">${ic('alert')}غير مصنّف: ${unc}</button>` : `<span class="pill ok">${ic('check')}كل الملفات مصنّفة</span>`}</div></div>
      </div>
      <section class="sec card pad"><h2>المؤشرات بحسب المجال</h2>${domRows}</section>
      <section class="sec"><h2>أين الفجوات؟</h2>
        <details class="card pad" ${empty ? '' : 'open'}><summary><b>مؤشرات لها نشاط في الخطة ولا دليل لها (${gapAct.length})</b></summary>
          <p class="hint">هذه أولى ما يُطلب توثيقه. اضغط على المؤشر لترى أنشطته.</p><div class="chips">${gapAct.map(chipInd).join('') || '<span class="muted">لا شيء. كل مؤشر له نشاط عليه دليل.</span>'}</div></details>
        <details class="card pad" style="margin-top:12px"><summary><b>مؤشرات لا يخدمها أي نشاط في الخطة التحسينية (${st.indicatorsNoActivity.length})</b></summary>
          <p class="hint">لا يمكن توثيقها عبر نشاط. تحتاج قراراً: إضافة نشاط لها من «الإدارة»، أو الاكتفاء بسجلاتها.</p><div class="chips">${st.indicatorsNoActivity.map(chipInd).join('')}</div></details>
        <details class="card pad" style="margin-top:12px"><summary><b>سجلات بلا ملفات (${st.registersWithoutFiles.length})</b></summary>
          <div class="chips" style="margin-top:10px">${st.registersWithoutFiles.map(id => `<button type="button" class="chip" data-do="open-reg" data-v="${esc(id)}">${esc(S.model.registerById[id].name)}</button>`).join('') || '<span class="muted">كل السجلات فيها ملفات.</span>'}</div></details>
      </section>
      ${recent.length ? `<section class="sec"><h2>آخر الإضافات</h2><div class="files">${recent.map(fileCard).join('')}</div></section>` : ''}
      <section class="sec card pad"><h2>النسخة الاحتياطية</h2>
        <p class="muted" style="margin-top:0">${lastBk ? `آخر نسخة: ${esc(fmtDate(lastBk))}${bkDays > 30 ? ' <span class="pill warn">مضى أكثر من شهر</span>' : ''}` : 'لم تؤخذ نسخة احتياطية بعد.'} احتفظ بنسخة خارج الأرشيف بين وقت وآخر.</p>
        <div class="tools"><button class="btn" type="button" data-do="export-csv">${ic('down')}جدول Excel للعام (CSV)</button><button class="btn" type="button" data-do="export-json">${ic('down')}نسخة كاملة (JSON)</button></div>
      </section>`;
  }

  /* ----- أدوات القوائم ----- */
  function toolbarHTML() {
    const t = S.tab;
    if (t === 'files') {
      const m = S.model;
      return `<div class="toolbar">
        <div class="grow"><label class="sr" for="fq">بحث</label><input id="fq" type="search" placeholder="ابحث في عنوان الملف أو ملاحظته…" value="${esc(S.fx.q)}"></div>
        <select id="fReg" aria-label="السجل">${regOptions(S.fx.register, 'كل السجلات')}</select>
        <select id="fAct" aria-label="النشاط">${actOptions(S.fx.activity, 'كل الأنشطة')}</select>
        <select id="fInd" aria-label="المؤشر">${indOptions(S.fx.indicator)}</select>
        <select id="fSt" aria-label="الحالة"><option value="">كل الحالات</option><option value="unclassified"${S.fx.status === 'unclassified' ? ' selected' : ''}>غير مصنّف</option><option value="classified"${S.fx.status === 'classified' ? ' selected' : ''}>مصنّف</option></select>
        <label class="toggle"><input id="fDel" type="checkbox"${S.fx.deleted ? ' checked' : ''}> المحذوفات</label></div>`;
    }
    const ph = { ind: 'ابحث برمز المؤشر أو نصه…', reg: 'ابحث في اسم السجل…', act: 'ابحث برمز النشاط أو عنوانه…' }[t];
    const extra = t === 'ind' ? `<label class="toggle"><input id="onlyNoEv" type="checkbox"${S.onlyNoEv ? ' checked' : ''}> بلا دليل فقط</label><label class="toggle"><input id="onlyNoAct" type="checkbox"${S.onlyNoAct ? ' checked' : ''}> بلا نشاط فقط</label>`
      : t === 'act' ? `<label class="toggle"><input id="onlyNoEv" type="checkbox"${S.onlyNoEv ? ' checked' : ''}> بلا ملفات فقط</label>` : '';
    return `<div class="toolbar"><div class="grow"><label class="sr" for="sq">بحث</label><input id="sq" type="search" placeholder="${ph}" value="${esc(S.sq[t])}"></div>${extra}</div>`;
  }
  function rebuildToolbarOptions() {
    if (S.tab !== 'files') return;
    const set = (id, html, val) => { const el = $(id); if (el) { el.innerHTML = html; el.value = val; } };
    set('#fReg', regOptions(S.fx.register, 'كل السجلات'), S.fx.register);
    set('#fAct', actOptions(S.fx.activity, 'كل الأنشطة'), S.fx.activity);
  }
  const actLabel = a => `${a.id} — ${a.title}`;
  function actOptions(sel, first) {
    return `<option value="">${esc(first || '+ إضافة نشاط…')}</option>` + S.model.activities.map(a => `<option value="${esc(a.id)}"${a.id === sel ? ' selected' : ''}>${esc(actLabel(a))}</option>`).join('');
  }
  function regOptions(sel, first, skip) {
    const out = [`<option value="">${esc(first || '+ إضافة سجل…')}</option>`];
    for (const g of S.model.registerGroups) {
      const rs = S.model.registers.filter(r => r.groupId === g.id && !r.hidden && !(skip || []).includes(r.id));
      if (rs.length) out.push(`<optgroup label="${esc(g.name)}">${rs.map(r => `<option value="${esc(r.id)}"${r.id === sel ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</optgroup>`);
    }
    return out.join('');
  }
  function indOptions(sel) {
    return '<option value="">كل المؤشرات</option>' + S.model.indicators.map(i => `<option value="${esc(i.code)}"${i.code === sel ? ' selected' : ''}>${esc(i.code)} — ${esc(i.text.slice(0, 48))}${i.text.length > 48 ? '…' : ''}</option>`).join('');
  }
  function fillList() {
    const el = $('#list'); if (!el) return;
    el.innerHTML = { ind: indListHTML, reg: regListHTML, act: actListHTML, files: filesListHTML }[S.tab]();
  }

  /* ----- المؤشرات ----- */
  function indStatus(i) {
    const n = S.stats.byIndicator[i.code];
    if (n > 0) return { cls: 'ok', t: `${n} ${n === 1 ? 'ملف' : 'ملفات'}` };
    if (i.activities.length) return { cls: 'warn', t: 'بلا دليل' };
    return { cls: '', t: 'لا نشاط في الخطة' };
  }
  function indListHTML() {
    const q = S.sq.ind.trim().toLowerCase(), m = S.model;
    let html = '', shown = 0;
    for (const d of m.domains) {
      let domHtml = '';
      for (const s of m.standards.filter(x => x.domain === d.id)) {
        const rows = m.indicators.filter(i => i.standard === s.id).filter(i => {
          if (q && !(i.code + ' ' + i.text).toLowerCase().includes(q)) return false;
          if (S.onlyNoEv && S.stats.byIndicator[i.code] > 0) return false;
          if (S.onlyNoAct && i.activities.length) return false;
          return true;
        });
        if (!rows.length) continue;
        shown += rows.length;
        domHtml += `<div class="card std"><div class="std-head"><h3>${esc(s.name)}</h3><span class="std-note">معيار ${esc(s.id)} · ${rows.length} مؤشر</span></div>${rows.map(indItem).join('')}</div>`;
      }
      if (domHtml) html += `<div class="group-title"><h2>${esc(d.id)} · ${esc(d.name)}</h2></div>${domHtml}`;
    }
    return shown ? html : '<div class="card empty"><h3>لا نتائج</h3><p>غيّر البحث أو ألغِ التصفية.</p></div>';
  }
  function indItem(i) {
    const open = S.open.ind.has(i.code), st = indStatus(i);
    const files = open ? L.filterFiles(S.view, { indicator: i.code }, S.model) : [];
    const body = open ? `<div class="item-body">
      <div><div class="lab">الأنشطة التي تخدم هذا المؤشر في الخطة</div>${i.activities.length ? `<div class="chips">${i.activities.map(id => `<button type="button" class="chip" data-do="filter" data-k="activity" data-v="${esc(id)}">${esc(id)} · ${esc(S.model.activityById[id].title)} <span class="pill">${S.stats.byActivity[id]}</span></button>`).join('')}</div>` : '<span class="muted">لا نشاط في الخطة التحسينية الحالية يخدم هذا المؤشر.</span>'}</div>
      <div><div class="lab">الملفات المرتبطة (${files.length})</div>${files.length ? `<div class="mini-files">${files.map(miniFile).join('')}</div>` : '<span class="muted">لا ملفات بعد.</span>'}</div>
      <div class="hint">لإضافة دليل لهذا المؤشر، افتح أحد أنشطته أعلاه واضغط «إضافة ملف».</div></div>` : '';
    return `<div class="item" id="ind-${esc(i.code)}"><button class="item-head" type="button" data-do="toggle" data-k="ind" data-v="${esc(i.code)}" aria-expanded="${open}">
      <span class="code ltr">${esc(i.code)}</span><span class="item-text">${esc(i.text)}</span>
      <span class="item-meta"><span class="pill ${st.cls}">${esc(st.t)}</span>${ic('chev', 'chev')}</span></button>${body}</div>`;
  }
  const miniFile = f => `<a href="${esc(safeHref(f.url))}" target="_blank" rel="noopener noreferrer">${ic('ext')}<span>${esc(f.title)}</span></a>`;

  /* ----- السجلات ----- */
  function regListHTML() {
    const q = S.sq.reg.trim().toLowerCase(), m = S.model;
    let html = '', shown = 0;
    for (const d of m.registerDomains) {
      let domHtml = '';
      for (const g of m.registerGroups.filter(x => x.domain === d.id)) {
        const regs = m.registers.filter(r => r.groupId === g.id && !r.hidden && (!q || r.name.toLowerCase().includes(q)));
        if (!regs.length && (q || g.registers.length)) continue;
        shown += regs.length || 1;
        const std = m.standards.find(s => s.id === g.suggestStd);
        domHtml += `<div class="card std"><div class="std-head"><h3>${esc(g.name)}</h3><span class="std-note">${esc(g.note)}${std ? ` · يقابله في مرجع المؤشرات «${esc(std.name)}» (مقترح، بانتظار تأكيد لجنة التطوير)` : ''}</span></div>
          ${regs.length ? regs.map(regItem).join('') : '<div class="pad muted">لا سجلات في هذا المعيار؛ يكتفى فيه بمتابعة البيئة المدرسية.</div>'}</div>`;
      }
      if (domHtml) html += `<div class="group-title"><h2>${esc(d.name)}</h2></div>${domHtml}`;
    }
    return shown ? html : '<div class="card empty"><h3>لا نتائج</h3><p>غيّر البحث.</p></div>';

  /* ---------- نافذة إضافة وتعديل ملف ---------- */
  let M = null;
  function openForm(file, preset) {
    if (!S.perm.write) return;
    M = { id: file ? file.id : null, activityIds: file ? [...(file.activityIds || [])] : [], registerIds: file ? [...(file.registerIds || [])] : [], dupAck: false, saving: false };
    if (preset) { if (preset.k === 'act') M.activityIds.push(preset.v); if (preset.k === 'reg') M.registerIds.push(preset.v); }
    const f = file || {};
    const root = $('#modal');
    root.innerHTML = `<div class="overlay" data-do="overlay"><form class="sheet" id="fileForm" role="dialog" aria-modal="true" aria-labelledby="fTitleH" novalidate>
      <div class="sheet-head"><h2 id="fTitleH" style="margin:0">${file ? 'تعديل الملف' : 'إضافة ملف'}</h2><button class="btn icon-btn" type="button" data-do="close-form" aria-label="إغلاق">${ic('x')}</button></div>
      <div class="field"><label for="ffTitle">عنوان الملف</label><input id="ffTitle" type="text" value="${esc(f.title || '')}" placeholder="مثال: صور برنامج الإذاعة المدرسية — اليوم الوطني" maxlength="200" autocomplete="off"><div class="err" id="eTitle"></div></div>
      <div class="field"><label for="ffUrl">رابط الملف أو المجلد</label><input id="ffUrl" type="url" inputmode="url" dir="ltr" value="${esc(f.url || '')}" placeholder="https://drive.google.com/…" autocomplete="off"><div class="hint">الأرشيف يحفظ الرابط فقط. ارفع الملف أولاً في Drive أو OneDrive الخاص بالمدرسة، ثم الصق رابط المشاركة. لا ترفع بيانات طلاب إلا بموافقة المدرسة.</div><div class="err" id="eUrl"></div></div>
      <div class="field"><label for="ffReg">السجل</label><select id="ffReg">${regOptions('', '+ إضافة سجل…', M.registerIds)}</select><div id="regChips" class="chips"></div></div>
      <div class="field"><label for="ffAct">النشاط في الخطة التحسينية</label><select id="ffAct">${actOptions('', '+ إضافة نشاط…')}</select><div id="actChips" class="chips"></div></div>
      <div class="field"><div class="lab">المؤشرات (تظهر تلقائياً من النشاط)</div><div id="indPrev" class="preview" aria-live="polite"></div></div>
      <div class="field"><label for="ffNote">ملاحظة (اختياري)</label><textarea id="ffNote" maxlength="600" placeholder="تاريخ التنفيذ، عدد المستفيدين، أي توضيح…">${esc(f.note || '')}</textarea></div>
      <div id="dupBox"></div><div class="err" id="eSave" role="alert"></div>
      <div class="sheet-foot"><button class="btn primary" type="submit" id="saveBtn">${file ? 'حفظ التعديل' : 'حفظ في الأرشيف'}</button><button class="btn" type="button" data-do="close-form">إلغاء</button></div>
    </form></div>`;
    paintPickers(); setTimeout(() => { const t = $('#ffTitle'); t && t.focus(); }, 30);
    document.body.style.overflow = 'hidden';
  }
  function closeForm() { $('#modal').innerHTML = ''; M = null; document.body.style.overflow = ''; }
  function paintPickers() {
    const m = S.model;
    $('#regChips').innerHTML = M.registerIds.map(id => m.registerById[id] ? `<span class="chip">${esc(m.registerById[id].name)}<button class="x" type="button" data-do="rm-reg" data-v="${esc(id)}" aria-label="إزالة">${ic('x')}</button></span>` : '').join('');
    $('#actChips').innerHTML = M.activityIds.map(id => m.activityById[id] ? `<span class="chip">${esc(actLabel(m.activityById[id]))}<button class="x" type="button" data-do="rm-act" data-v="${esc(id)}" aria-label="إزالة">${ic('x')}</button></span>` : '').join('');
    $('#ffReg').innerHTML = regOptions('', '+ إضافة سجل…', M.registerIds);
    const inds = L.indicatorsOfFile({ activityIds: M.activityIds }, m);
    const none = !M.activityIds.length && !M.registerIds.length;
    $('#indPrev').innerHTML = inds.length
      ? `<ul>${inds.map(c => `<li><span class="code ltr">${esc(c)}</span> ${esc(m.indicatorByCode[c].text)}</li>`).join('')}</ul>`
      : `<span class="muted">${M.activityIds.length ? 'هذا النشاط غير مربوط بمؤشر.' : M.registerIds.length ? 'اخترت سجلاً فقط؛ يُحفظ الملف في السجل دون مؤشرات. اختر نشاطاً لتظهر مؤشراته.' : 'لم تختر شيئاً بعد.'}</span>`
        + (none ? '<div class="warnbox">سيُحفظ الملف «غير مصنّف» ويمكنك تصنيفه لاحقاً.</div>' : '');
  }
  async function submitForm(ev) {
    ev.preventDefault();
    if (!M || M.saving) return;
    const title = $('#ffTitle').value.trim(), url = $('#ffUrl').value.trim(), note = $('#ffNote').value.trim();
    const res = L.validateFile({ title, url, activityIds: M.activityIds, registerIds: M.registerIds }, S.model);
    $('#eTitle').textContent = ''; $('#eUrl').textContent = ''; $('#eSave').textContent = '';
    $('#ffTitle').removeAttribute('aria-invalid'); $('#ffUrl').removeAttribute('aria-invalid');
    if (!res.ok) {
      if (!title) { $('#eTitle').textContent = 'اكتب عنواناً يعرّف الملف.'; $('#ffTitle').setAttribute('aria-invalid', 'true'); $('#ffTitle').focus(); }
      if (!L.normalizeUrl(url)) { $('#eUrl').textContent = 'ألصق رابطاً كاملاً يبدأ بـ https://'; $('#ffUrl').setAttribute('aria-invalid', 'true'); if (title) $('#ffUrl').focus(); }
      return;
    }
    const dup = L.findDuplicate(S.all, url, M.id);
    if (dup && !M.dupAck) {
      $('#dupBox').innerHTML = `<div class="warnbox" role="alert">هذا الرابط مضاف سابقاً باسم «${esc(dup.title)}». اضغط حفظ مرة أخرى إن كنت تقصد إضافته مجدداً.</div>`;
      M.dupAck = true; return;
    }
    M.saving = true; $('#saveBtn').disabled = true;
    const now = new Date().toISOString();
    const body = { title, url: L.normalizeUrl(url), note, activityIds: [...M.activityIds], registerIds: [...M.registerIds], updatedAt: now, updatedBy: S.perm.uid || null };
    try {
      if (M.id) await S.db.collection('evidence').doc(M.id).update(body);
      else await S.db.collection('evidence').add({ ...body, year: S.meta.year, createdBy: S.perm.uid || null, createdAt: now, deleted: false });
      const wasEdit = !!M.id;
      closeForm(); toast(wasEdit ? 'حُفظ التعديل' : 'أُضيف الملف إلى الأرشيف');
    } catch (e) { M.saving = false; $('#saveBtn').disabled = false; $('#eSave').textContent = dbMsg(e); }
  }

  /* ---------- العمليات ---------- */
  async function setDeleted(id, flag) {
    try { await S.db.collection('evidence').doc(id).update(flag ? { deleted: true, deletedBy: S.perm.uid || null, deletedAt: new Date().toISOString() } : { deleted: false, deletedBy: null, deletedAt: null }); return true; }
    catch (e) { toast(dbMsg(e)); return false; }
  }
  async function purge(id) {
    if (S.purgeArm !== id) { S.purgeArm = id; refresh(); setTimeout(() => { if (S.purgeArm === id) { S.purgeArm = null; refresh(); } }, 5000); return; }
    S.purgeArm = null;
    try { await S.db.collection('evidence').doc(id).delete(); toast('حُذف الملف نهائياً'); } catch (e) { toast(dbMsg(e)); }
  }
  async function saveFile(name, data, mime) {
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (!dl) { toast('التنزيل غير متاح في هذا العرض. افتح الأرشيف من متصفح الكمبيوتر.'); return false; }
    try { await dl.save({ filename: name, data }); return true; } catch (e) { if (!(e && e.code === 'rejected')) toast('لم يكتمل التنزيل.'); return false; }
  }
  async function exportCSV() {
    const rows = L.exportRows(S.view, S.model);
    if (!rows.length) { toast('لا ملفات في هذا العام لتصديرها.'); return; }
    if (await saveFile(`archive-${S.viewYear}-evidence.csv`, L.toCSV(rows))) { S.exported = true; toast('حُفظ جدول العام'); if (S.tab === 'adm') refresh(); }
  }
  async function exportJSON() {
    const now = new Date().toISOString();
    const payload = JSON.stringify({ school: SCHOOL, exportedAt: now, currentYear: S.meta.year, closedYears: S.meta.closed, custom: S.custom, files: S.files }, null, 2);
    if (await saveFile(`archive-backup-${now.slice(0, 10)}.json`, payload)) {
      S.exported = true;
      if (S.perm.admin) { try { await S.db.doc('meta/backup').set({ at: now, by: S.perm.uid || null }); } catch (e) { /* اختياري */ } }
      toast(`حُفظت نسخة كاملة (${nf.format(S.files.length)} ملف)`); if (S.tab === 'adm') refresh();
    }
  }
  async function newYear() {
    const cur = S.meta.year, nextY = String(Number(cur) + 1);
    const closed = [...new Set([...(S.meta.closed || []), cur])];
    try { await S.db.doc('meta/state').set({ year: nextY, closed }); S.viewYear = nextY; S.exported = false; recompute(); S.mounted = null; render(); toast(`بدأ العام ${nextY}هـ`); }
    catch (e) { toast(dbMsg(e)); }
  }
  function applyFilter(k, v) {
    S.fx = { q: '', indicator: '', activity: '', register: '', status: '', deleted: false }; S.fx[k] = v; go('files');
  }
  function openInd(code) { S.open.ind.add(code); S.sq.ind = ''; S.onlyNoEv = false; S.onlyNoAct = false; go('ind'); setTimeout(() => { const el = document.getElementById('ind-' + code); el && el.scrollIntoView({ block: 'center' }); }, 30); }
  function openReg(id) { S.open.reg.add(id); S.sq.reg = ''; go('reg'); setTimeout(() => { const el = document.getElementById('reg-' + id); el && el.scrollIntoView({ block: 'center' }); }, 30); }

  /* ---------- الأحداث ---------- */
  function wire() {
    document.addEventListener('click', async ev => {
      const t = ev.target.closest('[data-do],[data-tab]'); if (!t) return;
      if (t.dataset.tab) { go(t.dataset.tab); return; }
      const a = t.dataset.do, v = t.dataset.v, id = t.dataset.id;
      if (a === 'overlay') { if (ev.target === t) closeForm(); return; }
      switch (a) {
        case 'signout': { const p = window.ARCHIVE_PLATFORM; if (p && p.signOut) p.signOut(); break; }
        case 'theme': { const cur = document.documentElement.getAttribute('data-theme'); const dark = cur === 'dark' || (!cur && matchMedia('(prefers-color-scheme: dark)').matches); const nx = dark ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx); try { localStorage.setItem('arch-theme', nx); } catch (e) { } renderTop(); break; }
        case 'add': openForm(null); break;
        case 'add-for': openForm(null, { k: t.dataset.k, v }); break;
        case 'edit': { const f = S.all.find(x => x.id === id); f && openForm(f); break; }
        case 'close-form': closeForm(); break;
        case 'rm-reg': M.registerIds = M.registerIds.filter(x => x !== v); paintPickers(); break;
        case 'rm-act': M.activityIds = M.activityIds.filter(x => x !== v); paintPickers(); break;
        case 'del': { if (await setDeleted(id, true)) toast('نُقل الملف إلى المحذوفات', { action: () => setDeleted(id, false), label: 'تراجع' }); break; }
        case 'restore': if (await setDeleted(id, false)) toast('أُعيد الملف'); break;
        case 'purge': purge(id); break;
        case 'toggle': { const set = S.open[t.dataset.k]; set.has(v) ? set.delete(v) : set.add(v); fillList(); break; }
        case 'filter': applyFilter(t.dataset.k, v); break;
        case 'open-ind': openInd(v); break;
        case 'open-reg': openReg(v); break;
        case 'show-unc': S.fx = { q: '', indicator: '', activity: '', register: '', status: 'unclassified', deleted: false }; go('files'); break;
        case 'show-del': S.fx = { q: '', indicator: '', activity: '', register: '', status: '', deleted: true }; go('files'); break;
        case 'export-csv': exportCSV(); break;
        case 'export-json': exportJSON(); break;
        case 'new-year': newYear(); break;
        case 'add-reg': {
          const name = $('#nrName').value.trim(), groupId = $('#nrGroup').value;
          if (!name) { toast('اكتب اسم السجل.'); break; }
          saveCustom(c => { c.extraRegisters = c.extraRegisters || []; c.extraRegisters.push({ id: 'RX-' + Date.now().toString(36), name, groupId }); }); break;
        }
        case 'add-act': {
          const title = $('#naTitle').value.trim();
          if (!title) { toast('اكتب عنوان النشاط.'); break; }
          const nextN = Math.max(...S.model.activities.map(x => parseInt(x.id.slice(1), 10) || 0)) + 1;
          const inds = [...naInd]; naInd = [];
          saveCustom(c => { c.extraActivities = c.extraActivities || []; c.extraActivities.push({ id: 'ن' + String(nextN).padStart(2, '0'), title, indicators: inds }); }); break;
        }
        case 'na-rm': naInd = naInd.filter(x => x !== v); paintNaChips(); break;
      }
    });
    document.addEventListener('change', ev => {
      const t = ev.target;
      if (t.id === 'yearSel') { S.viewYear = t.value; recompute(); S.mounted = null; render(); return; }
      if (t.id === 'ffReg' && M) { if (t.value && !M.registerIds.includes(t.value)) M.registerIds.push(t.value); paintPickers(); return; }
      if (t.id === 'ffAct' && M) { if (t.value && !M.activityIds.includes(t.value)) M.activityIds.push(t.value); t.value = ''; paintPickers(); return; }
      if (t.id === 'naInd') { if (t.value && !naInd.includes(t.value)) naInd.push(t.value); t.value = ''; paintNaChips(); return; }
      if (t.id === 'fReg') { S.fx.register = t.value; fillList(); }
      else if (t.id === 'fAct') { S.fx.activity = t.value; fillList(); }
      else if (t.id === 'fInd') { S.fx.indicator = t.value; fillList(); }
      else if (t.id === 'fSt') { S.fx.status = t.value; fillList(); }
      else if (t.id === 'fDel') { S.fx.deleted = t.checked; fillList(); }
      else if (t.id === 'onlyNoEv') { S.onlyNoEv = t.checked; fillList(); }
      else if (t.id === 'onlyNoAct') { S.onlyNoAct = t.checked; fillList(); }
      else if (t.dataset && t.dataset.regName) {
        const id = t.dataset.regName, name = t.value.trim(); if (!name) { refresh(); return; }
        saveCustom(c => { c.registers = c.registers || {}; c.registers[id] = { ...(c.registers[id] || {}), name }; if (c.extraRegisters) c.extraRegisters.forEach(r => { if (r.id === id) r.name = name; }); });
      } else if (t.dataset && t.dataset.regHide) {
        const id = t.dataset.regHide, hidden = t.checked;
        saveCustom(c => { c.registers = c.registers || {}; c.registers[id] = { ...(c.registers[id] || {}), hidden }; });
      }
    });
    document.addEventListener('input', ev => {
      const t = ev.target;
      if (t.id === 'fq') { S.fx.q = t.value; fillList(); }
      else if (t.id === 'sq') { S.sq[S.tab] = t.value; fillList(); }
    });
    document.addEventListener('submit', ev => { if (ev.target.id === 'fileForm') submitForm(ev); });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && M) closeForm(); });
  }

  /* ---------- البداية ---------- */
  function boot() {
    try { const t = localStorage.getItem('arch-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) { }
    S.model = L.buildModel(DATA, {});
    S.stats = L.computeStats([], S.model);
    S.viewYear = S.meta.year;
    S.ready = true;
    wire(); render();
    connect().then(() => { recompute(); render(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
